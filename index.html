<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caro Arena — Đấu trí với Bot của anh</title>
<style>
  :root {
    --bg: #0B0F1A;
    --panel: #131A2A;
    --panel2: #1A2338;
    --pink: #FF2E63;
    --cyan: #00F5FF;
    --yellow: #FBFF12;
    --text: #E8ECF4;
    --muted: #8A94A8;
    --line: #26314D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 32px;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--pink), #FF7AA8 45%, var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.1;
  }
  header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  header p b { color: var(--cyan); }
  #status {
    margin: 12px 0;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    min-width: min(560px, 94vw);
  }
  #status.thinking { color: var(--yellow); }
  #status.win { color: var(--pink); }
  #status.lose { color: var(--cyan); }
  #status.draw { color: var(--muted); }
  #board-wrap {
    position: relative;
    width: min(560px, 94vw);
    aspect-ratio: 1;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 0 42px rgba(0, 245, 255, 0.12), 0 0 42px rgba(255, 46, 99, 0.10);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; }
  .controls, .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-top: 12px;
    width: min(560px, 94vw);
  }
  .ctl {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .controls select, .controls input, .toolbar button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    outline: none;
  }
  .controls input { width: 64px; text-align: center; }
  .toolbar button { cursor: pointer; }
  .toolbar button:hover { border-color: var(--cyan); }
  .toolbar button:disabled { opacity: 0.45; cursor: default; }
  .toolbar button.primary {
    background: linear-gradient(90deg, var(--pink), #D61C4E);
    border: none;
    color: #fff;
  }
  .toolbar button.primary:hover { filter: brightness(1.15); }
  .info {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
    width: min(560px, 94vw);
  }
  .chip {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .chip b { color: var(--text); }
  #engine-stats {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    min-height: 18px;
  }
  #engine-stats b { color: var(--cyan); }
  #moves {
    margin-top: 12px;
    width: min(560px, 94vw);
    max-height: 110px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
  }
  #moves b { color: var(--text); }
  .legend { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin: 0 3px 0 8px; }
  .legend.x { background: var(--pink); }
  .legend.o { background: var(--cyan); }
  footer { margin-top: 16px; font-size: 12px; color: #55617A; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>CARO ARENA</h1>
  <p>Đấu trí với <b>Bot của anh</b> — mạnh như engine cờ caro chuyên nghiệp</p>
</header>

<div id="status">Đang tải bot…</div>

<div id="board-wrap"><canvas id="board"></canvas></div>

<div class="controls">
  <label class="ctl">Cấp độ
    <select id="difficulty" title="Cấp độ bot">
      <option value="500">Dễ — 0.5s</option>
      <option value="1500" selected>Trung bình — 1.5s</option>
      <option value="3500">Khó — 3.5s</option>
      <option value="6000">Cao thủ — 6s</option>
    </select>
  </label>
  <label class="ctl">Bàn cờ
    <input id="boardsize" type="number" min="9" max="19" step="1" value="15" title="Cỡ bàn cờ (9–19)">
  </label>
  <label class="ctl">Bên
    <select id="side" title="Bạn cầm quân nào">
      <option value="1" selected>Bạn đi trước (X)</option>
      <option value="2">Bạn đi sau (O)</option>
    </select>
  </label>
</div>

<div class="toolbar">
  <button id="btn-new" class="primary">🔄 Ván mới</button>
  <button id="btn-undo" title="Hoàn tác 1 quân vừa đánh">↩ Hoàn tác</button>
  <button id="btn-redo" title="Đánh lại nước vừa hoàn tác">↪ Làm lại</button>
  <button id="btn-hint" title="Bot gợi ý nước tốt nhất cho anh">💡 Gợi ý</button>
  <button id="btn-stop" title="Dừng bot đang nghĩ, đánh lại nước vừa rồi">⏹ Dừng</button>
  <button id="btn-flip" title="Xoay bàn cờ 180°">🔃 Lật bàn</button>
</div>

<div class="info">
  <span class="chip">Thắng <b id="score-w">0</b></span>
  <span class="chip">Thua <b id="score-l">0</b></span>
  <span class="chip">Hòa <b id="score-d">0</b></span>
  <span class="chip"><span class="legend x" id="legend-you"></span>Bạn <b id="you-are">X</b><span class="legend o" id="legend-bot"></span>Bot</span>
</div>

<div id="engine-stats"></div>
<div id="moves"><b>Lịch sử nước đi</b><br><span id="moves-list">—</span></div>

<footer>Caro Arena • Luật tự do — 5 quân thẳng hàng là thắng • Chạy hoàn toàn trên trình duyệt của bạn</footer>

<script>
(function () {
  'use strict';
  let SIZE = 15;
  const COLS = 'ABCDEFGHIJKLMNOPQRS';
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const statsEl = document.getElementById('engine-stats');
  const movesListEl = document.getElementById('moves-list');
  const diffEl = document.getElementById('difficulty');
  const sideEl = document.getElementById('side');
  const sizeEl = document.getElementById('boardsize');

  let board = [];
  let moves = [];       // [{x, y, p}] p: 1=X, 2=O
  let redoStack = [];
  let gameOver = false;
  let botThinking = false;
  let humanSide = 1;
  let flip = false;
  let hover = null;
  let lastMove = null;
  let hint = null;
  let pendingReply = null; // {kind:'botmove'|'discard'|'hint'}
  let score = { w: 0, l: 0, d: 0 };
  try {
    const s = JSON.parse(localStorage.getItem('caro-arena-score') || '{}');
    score = { w: s.w | 0, l: s.l | 0, d: s.d | 0 };
  } catch (e) {}
  const botSide = () => 3 - humanSide;
  const nextPlayer = () => (moves.length % 2 === 0 ? 1 : 2);
  const isBotTurn = () => nextPlayer() === botSide();
  const humanLabel = () => humanSide === 1 ? 'X (hồng)' : 'O (xanh)';
  const clampSize = (n) => Math.max(9, Math.min(19, n || 15));

  function saveScore() {
    try { localStorage.setItem('caro-arena-score', JSON.stringify(score)); } catch (e) {}
    document.getElementById('score-w').textContent = score.w;
    document.getElementById('score-l').textContent = score.l;
    document.getElementById('score-d').textContent = score.d;
  }
  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }
  function yourTurnStatus() {
    setStatus('Lượt của bạn — đặt quân ' + humanLabel());
  }

  // ---------- Engine layer: worker first, main-thread fallback ----------
  function locateFile(url) {
    if (/^rapfi.*\.data$/.test(url)) url = 'rapfi.data';
    return '/build/' + url;
  }
  const Engine = {
    mode: 'worker',
    worker: null,
    mainInst: null,
    ready: false,
    failures: 0,
    readyCb: null,
    _wd: null,
    init(cb) {
      this.readyCb = cb;
      this.ready = false;
      this.failures = 0;
      this.startWorker();
    },
    startWorker() {
      try { if (this.worker) this.worker.terminate(); } catch (e) {}
      this.worker = null;
      this.mode = 'worker';
      let w;
      try { w = new Worker('engine-worker.js'); }
      catch (e) { this.onWorkerFailed('không tạo được worker: ' + (e.message || e)); return; }
      this.worker = w;
      w.onmessage = (e) => this.handleMsg(e.data);
      w.onerror = (e) => this.onWorkerFailed((e && e.message) || 'worker error');
      w.postMessage({ type: 'init' });
      clearTimeout(this._wd);
      this._wd = setTimeout(() => { if (!this.ready) this.onWorkerFailed('quá 20 giây chưa tải xong'); }, 20000);
    },
    handleMsg(d) {
      if (!d) return;
      if (d.type === 'ready') {
        clearTimeout(this._wd);
        this.ready = true;
        this.failures = 0;
        if (this.readyCb) this.readyCb();
      } else if (d.type === 'stdout') {
        onEngineLine(d.data);
      } else if (d.type === 'error' || d.type === 'worker-error' || d.type === 'exit') {
        this.onWorkerFailed(d.type + ': ' + d.data);
      }
      // stderr/status: ignore
    },
    onWorkerFailed(msg) {
      if (this.mode !== 'worker') return;
      this.ready = false;
      this.failures++;
      if (this.worker) { try { this.worker.terminate(); } catch (e) {} }
      this.worker = null;
      if (this.failures >= 2) {
        this.startMain();
      } else {
        setStatus('Bot gặp sự cố — đang tải lại…', 'thinking');
        setTimeout(() => this.startWorker(), 600);
      }
    },
    startMain() {
      this.mode = 'main';
      setStatus('Đang tải bot (chế độ dự phòng)…', 'thinking');
      loadMainEngine().then((inst) => {
        this.mainInst = inst;
        this.ready = true;
        if (this.readyCb) this.readyCb();
      }).catch((err) => {
        setStatus('Không tải được bot: ' + (err && err.message ? err.message : err) + ' — kiểm tra mạng rồi tải lại trang nhé.');
      });
    },
    restart(cb) {
      this.ready = false;
      this.readyCb = cb;
      if (this.mode === 'worker') {
        this.startWorker();
      } else {
        try { if (this.mainInst && this.mainInst.terminate) this.mainInst.terminate(); } catch (e) {}
        this.mainInst = null;
        this.startMain();
      }
    },
    send(cmd) {
      if (!this.ready) return;
      if (this.mode === 'worker') {
        if (this.worker) this.worker.postMessage({ type: 'command', data: cmd });
      } else if (this.mainInst) {
        // search blocks the main thread: let the UI paint first
        setTimeout(() => {
          try { this.mainInst.sendCommand(cmd); } catch (e) {}
        }, 30);
      }
    },
  };
  function loadMainEngine() {
    return new Promise((resolve, reject) => {
      const boot = () => {
        const factory = window['Rapfi'];
        if (typeof factory !== 'function') return reject(new Error('không thấy engine'));
        factory({
          locateFile: locateFile,
          onReceiveStdout: (o) => onEngineLine(o),
          onReceiveStderr: () => {},
          onExit: () => {},
          setStatus: () => {},
        }).then(resolve).catch(reject);
      };
      if (typeof window['Rapfi'] === 'function') return boot();
      const s = document.createElement('script');
      s.src = '/build/rapfi-single-simd128.js';
      s.onload = boot;
      s.onerror = () => reject(new Error('không tải được file engine'));
      document.head.appendChild(s);
    });
  }

  // ---------- Board drawing ----------
  function setupCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function cell() { return canvas.getBoundingClientRect().width / (SIZE + 1); }
  function toDisplay(x, y) { return flip ? { x: SIZE - 1 - x, y: SIZE - 1 - y } : { x: x, y: y }; }
  function fromDisplay(dx, dy) { return flip ? { x: SIZE - 1 - dx, y: SIZE - 1 - dy } : { x: dx, y: dy }; }
  function draw() {
    const rect = canvas.getBoundingClientRect();
    const W = rect.width, c = cell(), pad = c;
    ctx.clearRect(0, 0, W, W);
    const bg = ctx.createLinearGradient(0, 0, W, W);
    bg.addColorStop(0, '#1B2540');
    bg.addColorStop(1, '#121A2E');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, W);
    ctx.strokeStyle = '#3A4A6E';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < SIZE; i++) {
      ctx.moveTo(pad + i * c, pad); ctx.lineTo(pad + i * c, pad + (SIZE - 1) * c);
      ctx.moveTo(pad, pad + i * c); ctx.lineTo(pad + (SIZE - 1) * c, pad + i * c);
    }
    ctx.stroke();
    // star points
    const sp = [3, SIZE - 4], cpt = Math.floor((SIZE - 1) / 2);
    ctx.fillStyle = '#3A4A6E';
    [[sp[0], sp[0]], [sp[0], sp[1]], [sp[1], sp[0]], [sp[1], sp[1]], [cpt, cpt]].forEach(function (pt) {
      ctx.beginPath(); ctx.arc(pad + pt[0] * c, pad + pt[1] * c, 3.5, 0, Math.PI * 2); ctx.fill();
    });
    // coords (flip-aware labels)
    ctx.fillStyle = '#5A6B8F';
    ctx.font = Math.max(9, c * 0.32) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < SIZE; i++) {
      const bi = flip ? SIZE - 1 - i : i;
      ctx.fillText(COLS[bi], pad + i * c, pad - c * 0.62);
      ctx.fillText(String(bi + 1), pad - c * 0.62, pad + i * c);
    }
    // hover preview
    if (hover && !gameOver && !botThinking && board[hover.y][hover.x] === 0) {
      ctx.globalAlpha = 0.45;
      drawStone(hover.x, hover.y, humanSide);
      ctx.globalAlpha = 1;
    }
    // stones
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      if (board[y][x] !== 0) drawStone(x, y, board[y][x]);
    }
    // hint ring
    if (hint) {
      const d = toDisplay(hint.x, hint.y);
      ctx.strokeStyle = '#FBFF12';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(pad + d.x * c, pad + d.y * c, c * 0.42, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // last move marker
    if (lastMove) {
      const d = toDisplay(lastMove.x, lastMove.y);
      ctx.strokeStyle = '#FBFF12';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pad + d.x * c, pad + d.y * c, c * 0.36, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  function drawStone(x, y, p) {
    const c = cell(), pad = c;
    const d = toDisplay(x, y);
    const cx = pad + d.x * c, cy = pad + d.y * c, r = c * 0.44;
    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
    if (p === 1) { g.addColorStop(0, '#FF7AA8'); g.addColorStop(0.55, '#FF2E63'); g.addColorStop(1, '#B3123F'); }
    else { g.addColorStop(0, '#B8FBFF'); g.addColorStop(0.55, '#00F5FF'); g.addColorStop(1, '#0093A6'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  function posToCell(ev) {
    const rect = canvas.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    const py = (ev.touches ? ev.touches[0].clientY : ev.clientY) - rect.top;
    const c = cell(), pad = c;
    const dx = Math.round((px - pad) / c), dy = Math.round((py - pad) / c);
    if (dx < 0 || dx >= SIZE || dy < 0 || dy >= SIZE) return null;
    return fromDisplay(dx, dy);
  }

  // ---------- Game logic ----------
  function newBoard() {
    board = Array.from({ length: SIZE }, function () { return Array(SIZE).fill(0); });
    moves = [];
    gameOver = false;
    botThinking = false;
    pendingReply = null;
    lastMove = null;
    hint = null;
    hover = null;
    movesListEl.textContent = '—';
    statsEl.textContent = '';
    draw();
  }
  function checkWin(x, y, p) {
    const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
    for (let d = 0; d < dirs.length; d++) {
      const dx = dirs[d][0], dy = dirs[d][1];
      let n = 1;
      for (let s = 1; s < 5; s++) { const nx = x + dx * s, ny = y + dy * s; if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE || board[ny][nx] !== p) break; n++; }
      for (let s = 1; s < 5; s++) { const nx = x - dx * s, ny = y - dy * s; if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE || board[ny][nx] !== p) break; n++; }
      if (n >= 5) return true;
    }
    return false;
  }
  function placeStone(x, y, p) {
    board[y][x] = p;
    moves.push({ x: x, y: y, p: p });
    lastMove = { x: x, y: y };
    renderMoves();
    draw();
    return checkWin(x, y, p);
  }
  function renderMoves() {
    if (!moves.length) { movesListEl.textContent = '—'; return; }
    movesListEl.innerHTML = moves.map(function (m, i) {
      const label = COLS[m.x] + (m.y + 1);
      return (i % 2 === 0 ? '<b>' + (i / 2 + 1) + '.</b> ' : '') + (m.p === 1 ? 'X' : 'O') + ' ' + label;
    }).join(' &nbsp; ');
    movesListEl.parentElement.scrollTop = movesListEl.parentElement.scrollHeight;
  }
  function endGame(result) {
    gameOver = true;
    botThinking = false;
    if (result === 'win') { score.w++; setStatus('Bạn thắng rồi! Bot cũng có ngày thua 😎', 'win'); }
    else if (result === 'lose') { score.l++; setStatus('Bot thắng. Phục thù ván nữa không anh?', 'lose'); }
    else { score.d++; setStatus('Hòa! Căng như dây đàn.', 'draw'); }
    saveScore();
  }

  // ---------- Engine protocol ----------
  function onEngineLine(line) {
    if (!line) return;
    const m = line.match(/^(\d+),(\d+)$/);
    if (m) {
      const x = parseInt(m[1], 10), y = parseInt(m[2], 10);
      const pr = pendingReply; pendingReply = null;
      if (!pr) return;
      if (pr.kind === 'discard') {
        // engine replied to a no-move sync: take it back so its board matches ours
        Engine.send('TAKEBACK ' + x + ',' + y);
        botThinking = false;
        yourTurnStatus();
        return;
      }
      if (pr.kind === 'hint') {
        hint = { x: x, y: y };
        Engine.send('TAKEBACK ' + x + ',' + y);
        setStatus('Gợi ý: đánh ' + COLS[x] + (y + 1) + ' — ô vàng đứt nét trên bàn');
        draw();
        return;
      }
      // botmove
      botThinking = false;
      if (board[y] && board[y][x] === 0) {
        const won = placeStone(x, y, botSide());
        if (won) { endGame('lose'); return; }
        if (moves.length >= SIZE * SIZE) { endGame('draw'); return; }
        yourTurnStatus();
      }
      return;
    }
    if (line.indexOf('MESSAGE') === 0) {
      const sm = line.match(/Speed (\d+) \| Depth (\S+) \| Eval (-?\d+) \| Node (\S+) \| Time (\d+)ms/);
      const dm = line.match(/Depth (\d+-\d+) \| Eval (-?\d+) \| Time (\d+)ms/);
      if (sm) statsEl.innerHTML = 'Bot: độ sâu <b>' + sm[2] + '</b> • đánh giá <b>' + sm[3] + '</b> • <b>' + sm[1] + '</b> nút/giây • <b>' + sm[4] + '</b> nút • <b>' + sm[5] + 'ms</b>';
      else if (dm) statsEl.innerHTML = 'Bot đang nghĩ… độ sâu <b>' + dm[1] + '</b> • đánh giá <b>' + dm[2] + '</b>';
    }
  }
  // (Re)start the engine and bring it to the current position.
  function setupEngine() {
    const doSetup = () => {
      Engine.send('START ' + SIZE);
      Engine.send('INFO timeout_turn ' + diffEl.value);
      Engine.send('INFO timeout_match 100000');
      if (moves.length === 0) {
        if (humanSide === 2) {
          pendingReply = { kind: 'botmove' };
          botThinking = true;
          setStatus('Bot đi trước…', 'thinking');
          Engine.send('BEGIN');
        } else {
          yourTurnStatus();
        }
        return;
      }
      // Sync position with ONE multi-line BOARD command (must not be split:
      // the engine reads the whole block in a single call).
      const lines = ['BOARD'];
      moves.forEach(function (mv) { lines.push(mv.x + ',' + mv.y + ',' + mv.p); });
      lines.push('DONE');
      if (isBotTurn()) {
        pendingReply = { kind: 'botmove' };
        botThinking = true;
        setStatus('Bot đang nghĩ…', 'thinking');
      } else {
        pendingReply = { kind: 'discard' };
        botThinking = false;
      }
      Engine.send(lines.join('\n'));
    };
    Engine.restart(doSetup);
  }
  function botMoveAfterHuman(x, y) {
    botThinking = true;
    pendingReply = { kind: 'botmove' };
    setStatus('Bot đang nghĩ…', 'thinking');
    statsEl.textContent = '';
    Engine.send('TURN ' + x + ',' + y);
  }

  // ---------- Events ----------
  function humanPlay(x, y) {
    if (gameOver || botThinking || !Engine.ready) return;
    if (board[y][x] !== 0) return;
    hint = null;
    redoStack = [];
    const won = placeStone(x, y, humanSide);
    if (won) { endGame('win'); return; }
    if (moves.length >= SIZE * SIZE) { endGame('draw'); return; }
    botMoveAfterHuman(x, y);
  }
  canvas.addEventListener('click', function (ev) {
    const cellPos = posToCell(ev);
    if (cellPos) humanPlay(cellPos.x, cellPos.y);
  });
  canvas.addEventListener('mousemove', function (ev) {
    hover = posToCell(ev);
    draw();
  });
  canvas.addEventListener('mouseleave', function () { hover = null; draw(); });

  function applySideUI() {
    document.getElementById('you-are').textContent = humanSide === 1 ? 'X' : 'O';
    document.getElementById('legend-you').className = 'legend ' + (humanSide === 1 ? 'x' : 'o');
    document.getElementById('legend-bot').className = 'legend ' + (humanSide === 1 ? 'o' : 'x');
  }
  function newGame() {
    humanSide = parseInt(sideEl.value, 10);
    SIZE = clampSize(parseInt(sizeEl.value, 10) || 15);
    sizeEl.value = SIZE;
    applySideUI();
    newBoard();
    redoStack = [];
    hint = null;
    setStatus('Đang tải bot…');
    setupEngine();
  }
  document.getElementById('btn-new').addEventListener('click', newGame);
  document.getElementById('btn-undo').addEventListener('click', function () {
    if (botThinking || moves.length === 0) return;
    // Hoàn tác đúng 1 quân vừa đánh
    const mv = moves.pop();
    board[mv.y][mv.x] = 0;
    redoStack.push(mv);
    lastMove = moves.length ? moves[moves.length - 1] : null;
    hint = null;
    gameOver = false;
    renderMoves();
    draw();
    setStatus('Đang đồng bộ bot…');
    setupEngine();
  });
  document.getElementById('btn-redo').addEventListener('click', function () {
    if (botThinking || redoStack.length === 0) return;
    const mv = redoStack.pop();
    board[mv.y][mv.x] = mv.p;
    moves.push(mv);
    lastMove = mv;
    hint = null;
    gameOver = false;
    renderMoves();
    draw();
    setStatus('Đang đồng bộ bot…');
    setupEngine();
  });
  document.getElementById('btn-hint').addEventListener('click', function () {
    if (botThinking || gameOver || !Engine.ready) return;
    if (moves.length >= SIZE * SIZE) return;
    hint = null;
    pendingReply = { kind: 'hint' };
    const lines = ['BOARD'];
    moves.forEach(function (mv) { lines.push(mv.x + ',' + mv.y + ',' + mv.p); });
    lines.push('DONE');
    setStatus('Bot đang tính nước gợi ý…', 'thinking');
    Engine.send(lines.join('\n'));
  });
  document.getElementById('btn-stop').addEventListener('click', function () {
    if (!botThinking) return;
    // Dừng bot đang nghĩ, hủy nước vừa đánh để đánh lại
    botThinking = false;
    pendingReply = null;
    if (moves.length) {
      const mv = moves.pop();
      board[mv.y][mv.x] = 0;
      redoStack.push(mv);
      lastMove = moves.length ? moves[moves.length - 1] : null;
      hint = null;
      renderMoves();
      draw();
    }
    setStatus('Đã dừng bot — anh đánh lại nước vừa rồi');
    setupEngine();
  });
  document.getElementById('btn-flip').addEventListener('click', function () {
    flip = !flip;
    draw();
  });
  diffEl.addEventListener('change', function () {
    if (Engine.ready) Engine.send('INFO timeout_turn ' + diffEl.value);
  });
  sideEl.addEventListener('change', newGame);
  sizeEl.addEventListener('change', function () {
    SIZE = clampSize(parseInt(sizeEl.value, 10) || 15);
    sizeEl.value = SIZE;
    newGame();
  });
  window.addEventListener('resize', setupCanvas);

  // ---------- Boot ----------
  saveScore();
  applySideUI();
  newBoard();
  setupCanvas();
  setStatus('Đang tải bot…');
  Engine.init(function () {
    Engine.send('START ' + SIZE);
    Engine.send('INFO timeout_turn ' + diffEl.value);
    Engine.send('INFO timeout_match 100000');
    yourTurnStatus();
  });
})();
</script>
